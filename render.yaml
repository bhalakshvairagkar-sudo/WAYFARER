services:
  - type: web
    name: wayfarer-ai
    env: node
    plan: free
    buildCommand: npm --prefix client install --include=dev && npm --prefix server install && npm --prefix client run build
    startCommand: node server/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true

