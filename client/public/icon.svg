<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="compassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="180" stroke="#334155" stroke-width="12" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="140" stroke="url(#compassGrad)" stroke-width="8" opacity="0.4"/>
  <!-- Compass Needle -->
  <polygon points="256,96 296,256 256,236 216,256" fill="#38bdf8" filter="url(#glow)"/>
  <polygon points="256,416 296,256 256,236 216,256" fill="#64748b"/>
  <!-- Central Pivot -->
  <circle cx="256" cy="256" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="8"/>
  <circle cx="256" cy="256" r="10" fill="#38bdf8"/>
</svg>
